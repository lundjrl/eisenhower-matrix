name: Build

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
          - os: windows-latest
            artifact_name: windows
          - os: macos-latest
            artifact_name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux WebKit dev headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend assets
        run: npm run build
        working-directory: frontend

      - name: Build Go
        run: go build ./...

      - name: Build app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=1 wails build -tags webkit2_41

      - name: Build app (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eisenhower-matrix-${{ matrix.artifact_name }}
          path: build/bin/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: eisenhower-matrix-*
          path: artifacts

      - name: Compute next version tag
        id: version
        run: |
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((10#$patch + 1))"
          fi

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          tag="${{ steps.version.outputs.tag }}"

          for dir in eisenhower-matrix-linux eisenhower-matrix-windows eisenhower-matrix-macos-arm64; do
            if [ ! -d "artifacts/$dir" ]; then
              echo "::error::Expected build artifact 'artifacts/$dir' is missing" >&2
              exit 1
            fi
          done

          mkdir -p release-assets
          cp "artifacts/eisenhower-matrix-linux/eisenhower-matrix" "release-assets/eisenhower-matrix-linux-${tag}"
          cp "artifacts/eisenhower-matrix-windows/eisenhower-matrix.exe" "release-assets/eisenhower-matrix-windows-${tag}.exe"

          (cd artifacts/eisenhower-matrix-macos-arm64 && zip -r "../../release-assets/eisenhower-matrix-macos-arm64-${tag}.zip" eisenhower-matrix.app)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"

          gh release create "$tag" release-assets/* \
            --title "$tag" \
            --target "${{ github.sha }}" \
            --generate-notes
